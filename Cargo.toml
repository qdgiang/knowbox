[package]
publish = false
name = "knowbox"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
jiff = { version = "0.2.44", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
rusqlite = { version = "0.42.0", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
sha1 = { version = "0.11.0", default-features = false }
shlex = { version = "2.0.1", default-features = false, features = ["std"] }
tempfile = { version = "3.27.0", default-features = false }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

# House lint tables (kb-0275 refs file, section 5.1). A new workspace member needs [lints] workspace = true.
[workspace]

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
# panic paths and stubs
unwrap_used = "deny"
expect_used = "deny"
get_unwrap = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
exit = "deny"
# suppression hygiene: forces #[expect(..)], which fails once the lint stops firing
allow_attributes = "deny"
# async
await_holding_lock = "deny"
await_holding_invalid_type = "deny"
if_let_mutex = "deny"
large_futures = "warn"
# shape
redundant_clone = "deny"
rc_mutex = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
disallowed_methods = "deny"

[lints]
workspace = true
